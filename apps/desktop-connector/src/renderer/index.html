<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SALES-OS Connect</title><link rel="stylesheet" href="app.css"></head>
<body>
  <main>
    <header><span class="brand-mark" aria-hidden="true">S</span><div><p class="eyebrow">SALES-OS</p><h1>내 PC 연결</h1></div><span id="status-badge" class="badge">연결 필요</span></header>
    <p class="intro">업무 자료는 이 PC에 그대로.<br>필요한 순간, 비서가 읽을 수 있게 연결하세요.</p>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div id="error" class="error" role="alert" hidden></div>
    <form id="connect-form">
      <label for="server-url">SALES-OS 주소</label><input id="server-url" type="url" placeholder="https://sales.example.com" autocomplete="off" required>
      <label for="device-name">PC 이름</label><input id="device-name" maxlength="80" value="내 업무 PC" required>
      <label for="connect-code">연결 코드</label><input id="connect-code" maxlength="128" placeholder="웹에서 발급받은 코드" autocomplete="off" spellcheck="false" required>
      <p class="hint">SALES-OS 웹의 로컬 파일 화면에서 연결 코드를 발급받으세요.</p>
      <button class="primary" type="submit">이 PC 연결하기 <span aria-hidden="true">↗</span></button>
    </form>
    <section id="connected-panel" hidden>
      <div class="section-heading"><h2>연결된 폴더</h2><button id="add-folder" class="quiet">＋ 폴더 추가</button></div>
      <div id="folders" class="folder-list"></div>
      <p class="hint">지정한 폴더에서 요청한 파일만 읽습니다. 분석에 필요한 자료는 SALES-OS 서버와 AI에 전달됩니다.</p>
      <div class="settings">
        <div class="setting-row"><div><h3>파일 조회</h3><p>웹·LINE에서 보낸 요청을 처리합니다.</p></div><button id="pause-toggle" class="switch" role="switch" aria-label="파일 조회 허용" aria-checked="true"><span></span></button></div>
        <div class="setting-row"><div><h3>Windows 시작 시 실행</h3><p>로그인하면 연결을 시작합니다.</p></div><button id="login-toggle" class="switch" role="switch" aria-label="Windows 시작 시 실행" aria-checked="false"><span></span></button></div>
      </div>
      <div class="device-details"><span id="device-label"></span><span id="last-connected"></span></div>
      <div class="actions"><button id="retry" class="quiet">연결 확인</button><button id="disconnect" class="quiet muted">PC 연결 해제</button></div>
    </section>
    <footer><span>파일 읽기 전용 · <span id="version">0.1.0</span></span><button id="quit" class="quiet muted">프로그램 종료</button></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
